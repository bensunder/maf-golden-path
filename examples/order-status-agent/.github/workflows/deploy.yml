name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Owned by the platform team: azd provision + deploy, smoke check, live evals.
    uses: bensunder/maf-golden-path/.github/workflows/agent-deploy.yml@v0.2.0
    with:
      environment: ${{ inputs.environment || 'dev' }}
      agent-environment: ${{ inputs.environment == 'prod' && 'prod' || 'dev' }}
      python-version: "3.11"
