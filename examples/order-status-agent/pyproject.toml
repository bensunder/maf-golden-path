[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "order-status-agent"
version = "0.1.0"
description = "Answers order, shipping and small-refund questions for customer support staff."
requires-python = ">=3.11"
dependencies = [
    "agentkit-hosting[cosmos,redis]>=0.4,<0.5",
    "agentkit-telemetry[azure]>=0.4,<0.5",
    "agentkit-tools>=0.4,<0.5",
]

[project.optional-dependencies]
dev = [
    "agentkit-testing>=0.4,<0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/order_status_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: runs against the real model through the gateway (set AGENTKIT_LIVE_EVALS=1)"]
