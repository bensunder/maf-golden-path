# CI for the kit itself: packages, template (both install modes), sample, end-to-end smoke.
name: kit-ci
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # copier needs history to render the template
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Redis for session-store and multi-replica tests
        run: sudo apt-get install -y -qq redis-server
      - run: make install
      - name: Chromium for the web chat browser tests
        run: |
          python -m pip install -q "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Package tests
        run: make test-packages
      - name: Sample agent tests
        run: make test-example
      - name: Template renders and generated project passes its tests
        run: make test-template
      - name: Infrastructure and pipelines validate (Bicep, azure.yaml, actionlint, contracts)
        run: make test-infra
      - name: End-to-end smoke (real servers, fake gateway)
        run: make smoke
      - name: Annotate failing tests
        if: failure()
        run: python scripts/junit_annotations.py .results/*.xml
