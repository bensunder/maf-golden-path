[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentkit-tools"
version = "0.5.0"
description = "Connectors for Microsoft Agent Framework agents: OpenAPI-to-tool generation, Entra managed-identity and on-behalf-of auth, resilient HTTP, response shaping, MCP through the gateway."
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.19,<1.20",
    "agentkit-telemetry>=0.5,<0.6",
    "azure-identity>=1.19",
    "aiohttp>=3.9",  # transport for azure.identity.aio / azure.cosmos.aio (not pulled in by azure-core)
    "httpx>=0.27",
    "opentelemetry-api>=1.30",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]
