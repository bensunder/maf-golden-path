[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentkit-channels"
version = "0.8.0"
description = "Channels for agentkit services: Microsoft Teams (with Adaptive Card approvals), AG-UI web chat and the operations console, on top of agentkit-hosting's conversation service."
requires-python = ">=3.10"
dependencies = [
    "agentkit-hosting>=0.8,<0.9",
    "agentkit-tools>=0.8,<0.9",
    "ag-ui-protocol>=0.1.22,<0.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
teams = [
    "microsoft-agents-hosting-fastapi>=1.7,<2",
    "microsoft-agents-authentication-msal>=1.7,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

